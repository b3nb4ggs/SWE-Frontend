{% extends "main/base.html" %}


{% block content %}

<h1>Rooms and prices </h1>
<form method="post" action="#">
    {% csrf_token %}

<ul>
    
{% for item in roomlist %}

<li>Hotel:{{item.name}} <br>Room type:{{item.type}}<br>
    Price:{{item.price}}<br>Weekend Price:{{item.weekend_price}}
    <input type="checkbox", value="clicked", name="c{{item.index}}">
</li>

{% endfor %}

</ul>

<button type="submit", name="save", value="save">SAVE</button>
<input type="text", name="new">
<button type="submit", name="newItem", value="newItem">ADD</button>

</form>
{% endblock %}
