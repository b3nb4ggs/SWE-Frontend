{% extends 'main/base.html' %}
{% load crispy_forms_tags %}
{% block title %} My Account  {% endblock %}
{% block content %}

    {% if user.is_authenticated %}
<h1>My Account</h1><hr>

    {% else %}
        <p>You need to have an account to view this page!</p>
    {% endif %}
    <form method="POST" class="form-group" action="/home/">
    {% csrf_token %}
    {{form|crispy}}

    <button type="submit" class="btn btn-success"> Update Account Info </button>
</form>
{% endblock %}
