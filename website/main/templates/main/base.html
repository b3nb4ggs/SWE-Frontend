<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <style type="text/css">
    .navbar2 {
        width: 100%;
        top:0;
        left:0;
    }
    .errorlist
    {
        color: red;
    }
    body, html{
        height: 100%;
    }
    .main{
        background-image: url("{% static '' %}hotel.jpeg");
        background-size: cover;
        background-attachment: fixed;
    }
    .margins{
        margin-left: 50px;
        margin-right: 50px;
    }
    .outer{
    width:100%;
    text-align: center;
    }
    .inner
    {
    display: inline-block;
    }

    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> {% block title %} Hotel Reservation Website {% endblock %} </title>
</head>
<body class="main">
<nav class="navbar navbar2 navbar-expand-lg navbar-dark bg-dark"">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
    <div class="navbar-nav">
        <a class="nav-item nav-link active" href="/home/">Home</a>}
        {% if user.is_authenticated %}
            <a class="nav-item nav-link active" href="/viewAccount/">My Account</a>
            <a class="nav-item nav-link active" href="/viewReservations/">My Reservations</a>
            <a class="nav-item nav-link active" href="/logout/">Logout</a>
        {% else %}
            <a class="nav-item nav-link active" href="/register/">Create Account</a>
            <a class="nav-item nav-link active" href="/login/">Login</a>
        {% endif %}
    </div>
  </div>
</nav>


    <div class="margins" id="content", name="content" >
        <div class="row justify-content center">
        <div class = "col-8">


        {% block content %}
        {% endblock %}

    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>

</body>
</html>
